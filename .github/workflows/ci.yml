name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable MSVC)
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --component rustfmt clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Report exe size
        shell: pwsh
        run: '"notch.exe: {0:N2} MB" -f ((Get-Item target/release/notch.exe).Length / 1MB)'
      - uses: actions/upload-artifact@v4
        with:
          name: notch-exe
          path: target/release/notch.exe
